<body class="bg-background text-on-background h-full font-body-md text-body-md antialiased flex flex-col">
<!-- The Nav is suppressed because this is a transactional flow (Player Name Entry). -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-gutter">
<div class="w-full max-w-[480px]">
<a class="inline-flex items-center gap-2 text-primary hover:text-on-primary-fixed-variant transition-colors mb-stack-lg font-label-sm text-label-sm" href="#">
<span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
                Back to Home
            </a>
<div class="bg-surface-container-lowest border border-[#E5E7EB] rounded-lg p-[32px]">
<div class="text-center mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">
                        Ready to Play?
                    </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                        Enter your name to continue.
                    </p>
</div>
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<div>
<label class="sr-only" for="playerName">Your Name</label>
<input autocomplete="off" class="w-full bg-[#F9FAFB] border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-4 py-3 font-body-lg text-body-lg text-on-surface transition-colors placeholder:text-outline" id="playerName" name="playerName" placeholder="Your Name" required="" type="text"/>
</div>
<button class="w-full bg-[#2563EB] text-[#FFFFFF] font-label-sm text-label-sm py-4 px-6 rounded-DEFAULT hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-2 mt-4" type="submit">
                        Continue
                        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
</div>
</div>
</main>
