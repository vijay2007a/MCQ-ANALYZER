<!-- Top App Bar Mock -->
<div class="flex justify-between items-center px-gutter py-3 w-full pl-64 border-b border-outline-variant bg-surface dark:bg-surface-variant fixed top-0"></div>
</div>
<div class="absolute inset-0 bg-surface dark:bg-surface-variant opacity-40 blur-sm pointer-events-none z-0 md:hidden block"></div>

<div aria-modal="true" class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-40 flex items-center justify-center px-margin-mobile md:px-gutter" role="dialog">
<!-- Delete Confirmation Modal -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant w-full max-w-md overflow-hidden animate-[fade-in_0.2s_ease-out]">
<!-- Header area with danger indicator -->
<div class="p-6 pb-4 border-b border-outline-variant flex items-start gap-4">
<div class="flex-shrink-0 w-12 h-12 bg-error-container rounded-full flex items-center justify-center text-error">
<span class="material-symbols-outlined text-3xl" data-icon="delete_forever" data-weight="fill">delete_forever</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Delete Quiz?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Are you sure you want to permanently delete this quiz? This action cannot be undone and all associated data will be lost.</p>
</div>
</div>
<!-- Quiz Details Preview (Optional Context) -->
<div class="p-6 bg-surface-container-low border-b border-outline-variant">
<div class="flex flex-col gap-1">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-wider">Quiz Target</span>
<span class="font-body-md text-body-md text-on-surface font-semibold">Midterm Examination: Advanced Algorithms</span>
</div>
</div>

<div class="p-6 pt-4 bg-surface-container-lowest flex justify-end gap-3">
<button class="px-6 py-2 rounded border border-outline-variant text-on-surface font-label-sm text-label-sm hover:bg-surface-container-low transition-colors focus:ring-2 focus:ring-primary focus:outline-none">
                    Cancel
                </button>
<button class="px-6 py-2 rounded bg-error text-on-error font-label-sm text-label-sm hover:bg-error/90 transition-colors focus:ring-2 focus:ring-error focus:ring-offset-2 focus:ring-offset-surface-container-lowest focus:outline-none flex items-center gap-2">

                </button>
